name: Deploy TechStore API to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 266949372933
  ECR_REPOSITORY: techstore-api
  ECS_CLUSTER: techstore-cluster-01
  ECS_SERVICE: techstore-service-v2

defaults:
  run:
    shell: powershell

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Empaquetar proyecto sin tests
        run: .\mvnw.cmd clean package -DskipTests

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      - name: Verificar repositorio ECR
        run: aws ecr describe-repositories --repository-names $env:ECR_REPOSITORY --region $env:AWS_REGION

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir imagen Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          $image = "${env:ECR_REGISTRY}/${env:ECR_REPOSITORY}:latest"
          echo "Construyendo imagen: $image"
          docker build -t $image .

      - name: Subir imagen a Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          $image = "${env:ECR_REGISTRY}/${env:ECR_REPOSITORY}:latest"
          echo "Subiendo imagen: $image"
          docker push $image

      - name: Actualizar servicio ECS Fargate
        run: |
          aws ecs update-service --cluster $env:ECS_CLUSTER --service $env:ECS_SERVICE --force-new-deployment --region $env:AWS_REGION
          aws ecs wait services-stable --cluster $env:ECS_CLUSTER --services $env:ECS_SERVICE --region $env:AWS_REGION
