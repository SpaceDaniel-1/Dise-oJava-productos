name: Deploy TechStore API to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 266949372933
  ECR_REPOSITORY: techstore-api
  ECS_CLUSTER: techstore-cluster-01
  ECS_SERVICE: techstore-service-v2

defaults:
  run:
    shell: powershell

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Empaquetar proyecto sin tests
        run: .\mvnw.cmd clean package -DskipTests

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          unset-current-credentials: true

      - name: Verificar identidad AWS
        run: |
          aws sts get-caller-identity
          $account = aws sts get-caller-identity --query Account --output text
          if ($account -ne $env:AWS_ACCOUNT_ID) {
            throw "La cuenta AWS activa es $account, pero se esperaba $env:AWS_ACCOUNT_ID"
          }

      - name: Verificar repositorio ECR
        run: aws ecr describe-repositories --repository-names $env:ECR_REPOSITORY --region $env:AWS_REGION

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir imagen Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          $image = "${env:ECR_REGISTRY}/${env:ECR_REPOSITORY}:latest"
          Write-Host "Construyendo imagen: $image"
          docker build -t $image .

      - name: Subir imagen a Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          $image = "${env:ECR_REGISTRY}/${env:ECR_REPOSITORY}:latest"
          Write-Host "Subiendo imagen: $image"
          docker push $image

      - name: Actualizar servicio ECS Fargate
        run: |
          aws ecs update-service --cluster $env:ECS_CLUSTER --service $env:ECS_SERVICE --force-new-deployment --region $env:AWS_REGION

          for ($i = 1; $i -le 60; $i++) {
            $state = aws ecs describe-services `
              --cluster $env:ECS_CLUSTER `
              --services $env:ECS_SERVICE `
              --region $env:AWS_REGION `
              --query "services[0].deployments[0].rolloutState" `
              --output text

            Write-Host "Estado despliegue ECS: $state intento $i/60"

            if ($state -eq "COMPLETED") {
              Write-Host "Despliegue ECS completado correctamente"
              exit 0
            }

            if ($state -eq "FAILED") {
              throw "El despliegue ECS fallo"
            }

            Start-Sleep -Seconds 20
          }

          throw "El despliegue ECS no termino dentro del tiempo esperado"
